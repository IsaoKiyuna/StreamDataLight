# HTTP（ポート80）でアクセスされたら HTTPS にリダイレクト
server {
    listen 80;
    server_name streamdatalight.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS（ポート443）での本番サーバ
server {
    listen 443 ssl;
    server_name streamdatalight.com;

    ssl_certificate /etc/letsencrypt/live/streamdatalight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streamdatalight.com/privkey.pem;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # セキュリティと圧縮（任意だが推奨）
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
